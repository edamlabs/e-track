##### BUILD #####
[build-system]
requires = ["hatchling>=1.32", "uv-dynamic-versioning>=0.14.1"]
build-backend = "hatchling.build"

##### PROJECT #####
[project]
name = "e-track"
dynamic = ["version"]
description = "Run tracking for agent systems: one event model on a structlog channel, parallel sinks (OpenTelemetry, Langfuse, Cloud Trace, Prometheus, HTTP) and a live graph viewer."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "EDamLabs" }]
keywords = ["tracing", "observability", "opentelemetry", "structlog", "langgraph", "agents", "llm", "langfuse", "prometheus", "asyncio", "e-stack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    ##### the contract and the channel #####
    "msgspec>=0.21",
    "structlog>=26.1",
    ##### the bus #####
    "anyio>=4.6",
    ##### config #####
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
##### sources — LangGraph runs (deepagents included) through LangChain callbacks #####
langgraph = ["langchain-core>=1.5.2", "langgraph>=1.2.7"]
##### sinks — OTLP spans and logs (Langfuse, LangSmith, Tempo, Phoenix, any collector) #####
otel = ["opentelemetry-sdk>=1.44", "opentelemetry-exporter-otlp-proto-http>=1.44", "e-serde>=0.6.2", "e-track[auth]"]
##### sinks — any HTTP endpoint: the base a custom driver is built on (memory services, webhooks, own collectors) #####
http = ["httpx>=0.28", "e-track[auth]"]
##### sinks — Prometheus metrics, scraped from a mounted app; Grafana reads them #####
prometheus = ["prometheus-client>=0.21"]
##### auth — Google Application Default Credentials for any driver (Cloud Trace through the Telemetry API) #####
auth = ["google-auth>=2.40", "requests>=2.32"]
##### topology layout — Rust-backed graph algorithms #####
topology = ["rustworkx>=0.17"]
##### viewer — the live canvas: Litestar on granian's embedded server, the layout included #####
viewer = ["litestar>=2.25", "granian>=2.8.5", "e-serde>=0.6.4", "e-track[topology]"]
all = ["e-track[langgraph,otel,http,prometheus,topology,viewer]"]

[project.urls]
Homepage = "https://github.com/edamlabs/e-track"
Documentation = "https://edamlabs.github.io/e-track/"
Source = "https://github.com/edamlabs/e-track"
Issues = "https://github.com/edamlabs/e-track/issues"
Changelog = "https://github.com/edamlabs/e-track/blob/main/CHANGELOG.md"

### What this repository is in EDamLabs' taxonomy (https://github.com/edamlabs/e-workbench#identity).
[tool.edamlabs]
kind = "lib"
family = "eager"

##### DEPS #####
[dependency-groups]
lint = [
    "ruff>=0.16",
    "ty>=0.0.75",
    "tach>=0.35",
    "validate-pyproject[all]>=0.26",
    "zizmor>=1.25",
]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-xdist[psutil]>=3.8",
    "pytest-randomly>=5.0",
    "pytest-timeout>=2.4",
    ### the graph tests build real LangGraph graphs, deep-agent shaped, on a scripted chat model.
    "deepagents>=0.7.0",
    ### the fake collector: a real localhost HTTP server the OTLP exporter posts to.
    "pytest-httpserver>=1.2.0",
    "pytest-docker>=3.2.6",
    "playwright>=1.50",
    "fastapi>=0.115",
]
docs = [
    "mkdocstrings[python]>=1.0.7",
    "zensical>=0.0.70",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
    "prek>=0.4",
    "e-track[all]",
]

[tool.uv]
required-version = ">=0.12"
default-groups = ["dev"]
### a rolling freshness window: a release enters the lock once it has lived a week; Renovate moves it on schedule.
exclude-newer = "7 days"
### e-serde is first-party (the house encoder, released by us): exempt from the window, a fix lands the day it ships.
exclude-newer-package = { e-serde = false }
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

##### VERSION #####
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/etrack"]
### the canvas is part of the package: its built bundle ships (gitignored, so declared), its sources never do.
artifacts = ["src/etrack/ui/dist"]
exclude = [
    "src/etrack/ui/src",
    "src/etrack/ui/node_modules",
    "src/etrack/ui/*.json",
    "src/etrack/ui/*.ts",
    "src/etrack/ui/*.yaml",
    "src/etrack/ui/index.html",
    "src/etrack/ui/tsconfig.tsbuildinfo",
]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/"]
### the wheel is built from the sdist: the bundle travels in it, and an sdist install still has the canvas.
artifacts = ["src/etrack/ui/dist"]

##### LINT #####
[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "T20", "EM", "ISC",
    "PIE", "PT", "RET", "SIM", "TID", "TC", "ARG", "PTH", "PL", "PERF", "FURB",
    "ASYNC", "S", "BLE", "FBT", "LOG", "G", "RUF",
]
ignore = ["E501", "ISC001", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "PLR2004", "ARG", "FBT", "TID251"]
### the one module per foreign framework: an upgrade of that framework touches it alone.
### LangChain's callback signatures are the interface: their unused arguments are part of it.
"src/etrack/providers/adapters/source/langgraph.py" = ["TID251", "ARG002"]
"src/etrack/providers/adapters/topology/langgraph.py" = ["TID251"]
"src/etrack/providers/drivers/sink/otlp.py" = ["TID251"]
"src/etrack/processors/layout.py" = ["TID251"]
### Litestar resolves its handlers' signatures at runtime (parameters, OpenAPI): their annotation imports stay real.
"src/etrack/api/**" = ["TID251", "TC001", "TC003"]
"src/etrack/providers/adapters/server/granian.py" = ["TID251"]
"src/etrack/infra/auth.py" = ["TID251"]
"src/etrack/providers/drivers/sink/http.py" = ["TID251"]
"src/etrack/providers/adapters/sink/prometheus.py" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["etrack"]

[tool.ruff.lint.flake8-type-checking]
### pydantic and msgspec resolve these classes' annotations at runtime: their imports must stay real.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "etrack.infra.config.base.BaseSettings",
    "msgspec.Struct",
    "etrack.models.event.EventView",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
### the framework-agnostic core: only a source, a topology or a sink may speak a framework.
"langchain_core".msg = "only providers/adapters/source/langgraph speaks LangChain"
"langgraph".msg = "only providers/adapters/{source,topology}/langgraph speak LangGraph"
"opentelemetry".msg = "only providers/drivers/sink/otlp speaks OpenTelemetry"
"eserde".msg = "serialization belongs to what serializes: only providers/drivers/sink/otlp and etrack/api encode"
"rustworkx".msg = "only processors/layout speaks rustworkx"
"litestar".msg = "only etrack/api speaks Litestar"
"granian".msg = "only providers/adapters/server/granian speaks granian"
"google".msg = "only infra/auth speaks google-auth"
"requests".msg = "only infra/auth speaks requests"
"httpx".msg = "only providers/drivers/sink/http speaks httpx"
"prometheus_client".msg = "only providers/adapters/sink/prometheus speaks prometheus-client"

[tool.ruff.format]
docstring-code-format = true

##### TYPES #####
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

##### TEST #####
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
### tests on the path, not tests/unit: the mirror stays out of the `etrack` namespace.
pythonpath = ["src", "tests"]
strict = true
filterwarnings = ["error"]
timeout = "60"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: slow tests (deselect with -m 'not slow')",
    "integration: real services — the session fixtures bring tests/sandbox/compose.yml up and down (`make integration`, needs docker)",
]

##### COVERAGE #####
[tool.coverage.run]
source_pkgs = ["etrack"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", '^\s*\.\.\.$']
