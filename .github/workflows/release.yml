name: release

# Git-first: the tag IS the version (uv-dynamic-versioning). The fleet's release module (e-workbench) folds
# [Unreleased] into the CHANGELOG, merges the release PR and pushes the v* tag; this workflow publishes it.
# Nothing reaches PyPI until the repository sets PUBLISH_PYPI=true.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Republish an existing v* tag verbatim
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: sdist + wheel
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          GIVEN: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$GIVEN" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$GIVEN is not a vX.Y.Z tag" >&2; exit 1; }
          echo "tag=$GIVEN" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Build and smoke the wheel in a clean env
        run: make build
      - name: The artifacts carry the tag's version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ls dist/e_track-"${TAG#v}"-py3-none-any.whl dist/e_track-"${TAG#v}".tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist

  attest:
    name: build provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*

  publish:
    name: publish to PyPI
    if: vars.PUBLISH_PYPI == 'true'
    needs: [build, attest]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/e-track/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true

  github-release:
    name: GitHub release
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.build.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - name: Notes from the CHANGELOG section of the version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          awk -v s="## [${TAG#v}]" 'index($0,s)==1{p=1;next} p && /^## \[/{exit} p' CHANGELOG.md > notes.md
          gh release create "$TAG" dist/* --latest --verify-tag --notes-file notes.md \
            || gh release upload "$TAG" dist/* --clobber
