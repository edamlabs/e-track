##### SITE #####
[project]
site_name = "e-track"
site_description = "Run tracking for agent systems: one event model, a structlog channel, parallel sinks."
site_url = "https://edamlabs.github.io/e-track/"
repo_url = "https://github.com/edamlabs/e-track"
repo_name = "edamlabs/e-track"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 EDamLabs"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Introduction" = "introduction.md" },
    { "Installation" = "installation.md" },
    { "Usage" = "usage.md" },
  ] },
  { "Project" = [
    { "Decisions" = "decisions.md" },
  ] },
]

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/edamlabs/e-track"

##### THEME #####
[project.theme]
variant = "classic"
logo = "assets/etrack.svg"
favicon = "assets/etrack.svg"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "navigation.instant",
  "toc.follow",
  "content.code.copy",
]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle = { icon = "material/weather-night", name = "Light mode" }

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle = { icon = "material/weather-sunny", name = "Dark mode" }

##### MARKDOWN #####
[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}

##### PLUGINS #####
[project.plugins.autorefs]

[project.plugins.mkdocs-autoapi]
autoapi_dir = "src"
autoapi_root = "reference"
autoapi_add_nav_entry = "Reference"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
merge_init_into_class = true
show_signature_annotations = true
separate_signature = true
signature_crossrefs = true
show_source = false
show_root_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true
filters = ["!^_[^_]"]
