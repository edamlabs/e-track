##### SITE #####
[project]
site_name = "e-track"
site_description = "Run tracking for agent systems: one event model, a structlog channel, parallel sinks."
site_url = "https://edamlabs.github.io/e-track/"
repo_url = "https://github.com/edamlabs/e-track"
repo_name = "edamlabs/e-track"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 EDamLabs"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "What it is" = "start/introduction.md" },
    { "Install" = "start/installation.md" },
    { "Run it in 3 steps" = "start/quickstart.md" },
  ] },
  { "Basic use" = [
    { "Track a run" = "basics/tracking.md" },
    { "Send events" = "basics/events.md" },
    { "Watch it live" = "basics/viewer.md" },
  ] },
  { "Advanced" = [
    { "The record" = "advanced/record.md" },
    { "Own spans, facts and masks" = "advanced/spans.md" },
    { "The run from inside" = "advanced/runs.md" },
    { "Custom sinks and policies" = "advanced/sinks.md" },
    { "Custom drivers (HTTP)" = "advanced/drivers.md" },
    { "Authentication" = "advanced/auth.md" },
    { "Graphs and labels" = "advanced/graphs.md" },
    { "Logging" = "advanced/logging.md" },
    { "Settings and errors" = "advanced/settings.md" },
    { "Upgrading to 0.6" = "advanced/migration.md" },
  ] },
  { "Integrations" = [
    { "LangGraph and deepagents" = "integrations/langgraph.md" },
    { "Langfuse" = "integrations/langfuse.md" },
    { "Phoenix" = "integrations/phoenix.md" },
    { "LangSmith" = "integrations/langsmith.md" },
    { "Cloud Trace" = "integrations/cloudtrace.md" },
    { "Prometheus and Grafana" = "integrations/prometheus.md" },
    { "OpenTelemetry" = "integrations/opentelemetry.md" },
    { "Web apps" = "integrations/web.md" },
  ] },
  { "API" = [
    { "At a glance" = "reference/api.md" },
  ] },
  { "Project" = [
    { "Decisions" = "decisions.md" },
  ] },
]

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/edamlabs/e-track"

##### THEME #####
[project.theme]
variant = "classic"
logo = "assets/etrack.svg"
favicon = "assets/etrack.svg"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "navigation.instant",
  "toc.follow",
  "content.code.copy",
]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle = { icon = "material/weather-night", name = "Light mode" }

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle = { icon = "material/weather-sunny", name = "Dark mode" }

##### MARKDOWN #####
[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}

##### PLUGINS #####
[project.plugins.autorefs]

[project.plugins.mkdocs-autoapi]
autoapi_dir = "src"
autoapi_root = "reference"
autoapi_add_nav_entry = "Reference"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
merge_init_into_class = true
show_signature_annotations = true
separate_signature = true
signature_crossrefs = true
show_source = false
show_root_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true
filters = ["!^_[^_]"]
