##### THE INTEGRATION SANDBOX — what etrack exports to, brought up and torn down by the tests' session fixtures #####
### host ports are ephemeral (127.0.0.1::<port>): two sessions, or a developer's own stack, never collide.
### the fixtures set SANDBOX_OUT (a per-session temp dir) and the host user: the collector writes files the tests read.

services:
  ##### the protocol: any OTLP/HTTP collector — traces and logs written back as OTLP/JSON lines #####
  collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    user: "${SANDBOX_UID:?}:${SANDBOX_GID:?}"
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol/collector.yaml:ro
      - ${SANDBOX_OUT:?}:/out
    ports:
      - "127.0.0.1::4318"
      - "127.0.0.1::13133"

  ##### the dialect: an OpenInference backend — reads the span kinds the driver writes, answers on its REST API #####
  phoenix:
    image: arizephoenix/phoenix:version-21.0.0
    ### Phoenix 21 authenticates OTLP by default (401); the sandbox is local and throwaway. Headers are unit-tested.
    environment:
      PHOENIX_ENABLE_AUTH: "false"
    ports:
      - "127.0.0.1::6006"
